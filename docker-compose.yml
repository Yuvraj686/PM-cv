version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  celery_worker:
    build: ./backend
    command: celery -A celery_worker worker --loglevel=info --concurrency=2
    depends_on:
      - redis
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  celery_beat:
    build: ./backend
    command: python -m celery -A celery_worker.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler --schedule /tmp/celerybeat-schedule
    depends_on:
      - redis
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

# Note: PostgreSQL is hosted on Supabase — no local pg container needed
