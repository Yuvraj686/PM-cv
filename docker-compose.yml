

services:
  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - projecthub_network

  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - projecthub_network

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build: ./backend
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - projecthub_network

  # ─── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery_beat:
    build: ./backend
    command: python -m celery -A celery_worker.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - projecthub_network

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    env_file: ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - projecthub_network

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  projecthub_network:
    driver: bridge

# Note: PostgreSQL is hosted on Supabase — no local pg container needed
